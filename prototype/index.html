<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Ordo — 前端原型</title>
  <style>
/* ===== tokens.css ===== */
/* Ordo 设计令牌（暖纸色亮主题 + 深锈红 accent，详见 README）*/

:root {
  /* 色板：暖纸色亮色主题 */
  --bg: #f7f6f3;
  --panel: #ffffff;
  --panel-soft: #f1efe9;
  --text: #21201c;
  --text-soft: #5f5b52;
  --text-faint: #98938a;
  --line: #e6e3db;
  --line-strong: #d8d4c9;
  --ink: #26251f;
  --ink-hover: #3a3830;
  --accent: #4e6ef2;
  --accent-soft: rgba(78, 110, 242, 0.1);
  --ok: #1d8a4e;
  --ok-soft: rgba(29, 138, 78, 0.1);
  --warn: #b36205;
  --warn-soft: #fdf6ec;
  --warn-line: #ecd9b7;
  --danger: #c23b3b;
  --danger-soft: #fbf0ef;
  --code-bg: #26251f;
  --code-text: #e9e7e0;

  /* 字体 */
  --sans: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --mono: "Cascadia Mono", Consolas, "Courier New", monospace;

  /* 栅格与形状 */
  --radius-s: 8px;
  --radius-m: 12px;
  --radius-l: 16px;
  --shadow-s: 0 1px 2px rgba(33, 32, 28, 0.05);
  --shadow-m: 0 8px 24px rgba(33, 32, 28, 0.1);
  --dur: 140ms;
}

</style>
  <style>
/* ===== layout.css ===== */
/* 三段式布局：侧栏 / 顶栏 / 对话流 + 输入区 —— 对应设计文档 §3 */

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}
button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}
button:disabled { cursor: not-allowed; }
.spacer { flex: 1; }
.hidden { display: none !important; }
svg { flex: none; }

#app { display: flex; height: 100vh; }

/* ---------- 侧栏 ---------- */
#sidebar {
  width: 264px;
  flex: none;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--bg);
}
.side-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 16px 10px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
}
.side-head .logo-mark { color: var(--ink); }
#new-session {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 12px 8px;
  padding: 8px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--panel);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-s);
  transition: background var(--dur), border-color var(--dur);
}
#new-session:hover { background: var(--panel-soft); border-color: var(--text-faint); }

/* 侧栏功能入口（技能市场 / 自动化 / 知识库 / 专家）——4×1 竖排，点击在侧栏内切换视图 */
.side-nav { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 0 12px 4px; }
.side-nav button {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-s);
  font-size: 12.5px;
  color: var(--text-soft);
  transition: background var(--dur), color var(--dur);
}
.side-nav button:hover { background: var(--panel-soft); color: var(--text); }
.side-nav button.active { background: var(--panel-soft); color: var(--text); font-weight: 500; }
.side-nav button svg { color: var(--text-faint); }
.side-nav button.active svg { color: var(--accent); }
.side-nav-divider { height: 1px; margin: 6px 16px 0; background: var(--line); }

/* 侧栏底部：个人信息区 + 设置入口（ChatGPT / Claude 桌面端同款） */
.side-foot { display: flex; align-items: center; gap: 4px; padding: 8px 10px 10px; border-top: 1px solid var(--line); }
.user-chip {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  border: none;
  border-radius: var(--radius-s);
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background var(--dur);
}
.user-chip:hover { background: var(--panel-soft); }
.avatar {
  display: grid;
  place-items: center;
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
}
.user-chip .u-main { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
.user-chip .u-name { font-size: 12.5px; font-weight: 500; color: var(--text); line-height: 1.35; }
.user-chip .u-dept { font-size: 10.5px; color: var(--text-faint); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot-gear {
  display: grid;
  place-items: center;
  flex: none;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: var(--radius-s);
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
  transition: background var(--dur), color var(--dur);
}
.foot-gear:hover { background: var(--panel-soft); color: var(--text); }

/* 设置弹窗（ChatGPT 桌面端同款模态；市场类页面走主区域，设置走模态） */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: grid;
  place-items: center;
  background: rgba(38, 37, 31, 0.32);
}
.modal-overlay.hidden { display: none; }
.modal {
  width: min(560px, 92vw);
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  background: var(--bg);
  box-shadow: 0 18px 50px rgba(38, 37, 31, 0.22);
  overflow: hidden;
}
.modal .m-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  font-weight: 600;
}
.modal .m-close {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
}
.modal .m-close:hover { background: var(--panel-soft); color: var(--text); }
.modal .m-body { padding: 4px 18px 16px; overflow-y: auto; }
.modal .m-sec { margin: 14px 0 4px; font-size: 11px; font-weight: 600; color: var(--text-faint); letter-spacing: 0.5px; }
.modal .m-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 12.5px;
  color: var(--text);
}
.modal .m-row:last-child { border-bottom: none; }
.modal .m-row .m-sub { display: block; margin-top: 1px; font-size: 11px; color: var(--text-faint); }
.modal .m-mono { font-family: var(--mono); font-size: 11px; color: var(--text-soft); word-break: break-all; text-align: right; }
.modal .m-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.modal .mini {
  padding: 3px 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--panel);
  font-size: 11px;
  color: var(--text);
  cursor: pointer;
}
.modal .mini:hover { background: var(--panel-soft); }

/* 市场页（主区域切换：对齐 ChatGPT GPT 商店 / Kimi 工具市场 / WorkBuddy 技能市场页）
   侧栏保持会话列表不动，点击模块切换主区域；再点同一模块或点会话返回对话。 */
#module-page {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 18px 28px 14px;
  overflow: hidden;
}
#module-page.hidden { display: none; }
.mkp-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.mkp-head .mkp-title { font-size: 16px; font-weight: 600; }
.mkp-head .mv-back {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  background: var(--panel);
  color: var(--text-soft);
  cursor: pointer;
}
.mkp-head .mv-back:hover { background: var(--panel-soft); color: var(--text); }
.mkp-head .mk-search { margin: 0 0 0 auto; width: min(320px, 40%); }
.mkp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px; }
.mkp-foot { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.mk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 10px; }

/* 市场卡片（宽版竖排）：来源标签 + 版本 / 描述 / 权限 / 启停 */
.mk-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  background: var(--panel);
  transition: border-color var(--dur), background var(--dur);
}
.mk-card:hover { border-color: var(--line-strong); }
.mk-card .mk-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mk-card .mk-ic {
  display: grid;
  place-items: center;
  flex: none;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  color: var(--accent);
}
.mk-card .r-name { font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-card .mk-desc {
  font-size: 12px;
  color: var(--text-soft);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 37px;
}
.mk-card .mk-perms { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); }
.mk-card .mk-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.mk-card .mk-state { font-size: 11px; color: var(--text-faint); }
.mk-card.off .mk-state { color: var(--danger); }
.mk-card .mk-foot-r { display: flex; align-items: center; gap: 8px; }
#session-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 12px 12px;
}
.session-group { margin-top: 12px; }
.session-group > .group-label {
  padding: 0 10px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-faint);
  letter-spacing: 0.5px;
}
.session-item {
  position: relative;
  padding: 7px 10px;
  border-radius: var(--radius-s);
  cursor: pointer;
  transition: background var(--dur);
}
.session-item:hover { background: var(--panel-soft); }
.session-item.active { background: var(--panel-soft); }
.session-item.active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 2px;
  border-radius: 1px;
  background: var(--accent);
}
.session-item .t {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-item .d { margin-top: 1px; font-size: 11px; color: var(--text-faint); }
.session-item .d .run-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 4px;
  vertical-align: 1px;
  animation: pulse 1.2s ease-in-out infinite;
}
.session-item .pin-flag { margin-right: 4px; vertical-align: -2px; color: var(--accent); }

/* 会话搜索（对标 ChatGPT / Claude / Kimi 列表顶部检索，Ctrl K 聚焦） */
.session-search { position: relative; margin: 10px 12px 2px; }
.session-search > svg {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-faint);
  pointer-events: none;
}
.session-search input {
  width: 100%;
  box-sizing: border-box;
  padding: 6px 44px 6px 28px;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  background: var(--panel);
  font-family: inherit;
  font-size: 12.5px;
  color: var(--text);
  outline: none;
  transition: border-color var(--dur);
}
.session-search input:focus { border-color: var(--accent); }
.session-search input::placeholder { color: var(--text-faint); }
.session-search kbd {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.4;
  color: var(--text-faint);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 4px;
  background: var(--panel);
  pointer-events: none;
}
.session-search input:focus + kbd { display: none; }
.session-empty {
  padding: 18px 12px;
  font-size: 12px;
  color: var(--text-faint);
  text-align: center;
}

/* 悬停操作：⋯ 菜单入口（ChatGPT / Kimi 样式），右侧渐隐遮住溢出文本 */
.session-item .acts {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  display: none;
  padding-left: 16px;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0), var(--panel-soft) 9px);
}
.session-item:hover .acts { display: block; }
.session-item .acts button {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
}
.session-item .acts button:hover { background: rgba(38, 37, 31, 0.08); color: var(--text); }
.menu-item.danger { color: var(--danger); }
.menu-item.danger .mi-check { color: var(--danger); }

/* 行内重命名（Enter 提交 / Esc 取消） */
.session-item input.rename {
  width: 100%;
  box-sizing: border-box;
  margin: 1px 0 2px;
  padding: 2px 6px;
  border: 1px solid var(--accent);
  border-radius: 5px;
  background: var(--panel);
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  outline: none;
}

/* 行内删除确认（与 L2 确认卡同一「行内确认」哲学，不用弹窗） */
.session-item .del-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 1px 0 2px;
  font-size: 11.5px;
  color: var(--text-soft);
}
.session-item .del-row .mini {
  padding: 2px 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--panel);
  font-size: 11px;
  color: var(--text);
  cursor: pointer;
}
.session-item .del-row .mini:hover { background: var(--panel-soft); }
.session-item .del-row .mini.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.session-item .del-row .mini.danger:hover { background: #a93232; }

/* 工作区分组（对齐 WorkBuddy「空间」视图：按工作空间归档任务，分组标题吸顶） */
.session-group > .ws-group-head {
  position: sticky;
  top: -4px;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 0 -4px;
  padding: 5px 4px;
  background: var(--bg);
  border-radius: var(--radius-s);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-faint);
  letter-spacing: 0.3px;
  cursor: pointer;
  user-select: none;
}
.ws-group-head .chev { transition: transform var(--dur); color: var(--text-faint); flex: none; }
.session-group.collapsed > .ws-group-head .chev { transform: rotate(-90deg); }
.ws-group-head .g-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-group-head .g-cnt { font-weight: 400; color: var(--text-faint); flex: none; }
.ws-group-head .g-acts { display: none; align-items: center; gap: 2px; flex: none; }
.ws-group-head:hover .g-acts { display: flex; }
.ws-group-head:hover .g-cnt { display: none; }
.ws-group-head .g-acts button {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
}
.ws-group-head .g-acts button:hover { background: rgba(38, 37, 31, 0.08); color: var(--text); }
.session-group.collapsed .session-item { display: none; }

/* ---------- 主列（对话 + 工作台 双栏） ---------- */
#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}
#content-row { flex: 1; min-height: 0; display: flex; }
#chat-pane {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ---------- 工作台（对齐豆包侧边工作台 / 千问办公工作台 / Kimi 看板） ---------- */
#workbench {
  flex: none;
  width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border-left: 1px solid transparent;
  background: var(--panel);
  transition: width var(--dur), border-color var(--dur);
}
#workbench.open { width: 400px; border-left-color: var(--line); }
.wb-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}
.wb-tabs { display: flex; gap: 4px; flex: 1; }
.wb-tab {
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  color: var(--text-soft);
  transition: background var(--dur), color var(--dur);
}
.wb-tab:hover { background: var(--panel-soft); }
.wb-tab.active { background: var(--panel-soft); color: var(--text); font-weight: 600; }
#wb-collapse {
  display: flex;
  padding: 6px;
  border-radius: var(--radius-s);
  color: var(--text-faint);
}
#wb-collapse:hover { background: var(--panel-soft); color: var(--text); }
.wb-body { flex: 1; overflow-y: auto; padding: 14px; scrollbar-width: thin; }
.wb-empty { padding: 28px 10px; font-size: 12.5px; color: var(--text-faint); line-height: 1.7; text-align: center; }
.wb-section-title { margin: 4px 0 10px; font-size: 12px; font-weight: 600; color: var(--text-soft); }

/* 工作台内：进度步骤 */
.wb-step { display: flex; align-items: flex-start; gap: 9px; padding: 7px 2px; font-size: 13px; color: var(--text-soft); }
.wb-step .ps-icon { display: flex; margin-top: 1px; color: var(--text-faint); }
.wb-step.running .ps-icon { color: var(--accent); }
.wb-step.done .ps-icon { color: var(--ok); }
.wb-step.running { color: var(--text); font-weight: 500; }
.wb-step.done { color: var(--text-faint); }

/* 工作台内：交付物列表与预览 */
.wb-file {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  background: var(--panel);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--dur), background var(--dur);
}
.wb-file:hover { border-color: var(--line-strong); background: var(--panel-soft); }
.wb-file svg { color: var(--text-faint); }
.wb-file .f-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wb-file .f-name { font-size: 13px; font-weight: 500; }
.wb-file .f-path {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wb-preview-back {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-soft);
}
.wb-preview-back:hover { background: var(--panel-soft); color: var(--text); }
.wb-preview-path {
  margin-bottom: 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-faint);
  word-break: break-all;
}

/* 顶栏工作台开关 */
#wb-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  font-size: 12px;
  color: var(--text-soft);
  transition: border-color var(--dur), color var(--dur);
}
#wb-toggle:hover { border-color: var(--text-faint); color: var(--text); }
#wb-toggle svg { color: var(--text-faint); }
#wb-badge {
  min-width: 16px;
  height: 16px;

// ===== js/format.js =====
// 展示格式化：相对时间 / 耗时 / 参数摘要 / 工具名映射 —— 对应设计文档 §4.2 / §6.2

function relTime(iso) {
  if (!iso) return "";
  const t = new Date(iso).getTime();
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return `${m} 分钟前`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} 小时前`;
  if (h < 48) return "昨天";
  const d = Math.floor(h / 24);
  if (d < 7) return `${d} 天前`;
  return new Date(iso).toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" });
}

function sessionGroup(iso) {
  const t = new Date(iso).getTime();
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (t >= startOfDay) return "今天";
  if (t >= startOfDay - 86400000) return "昨天";
  if (t >= startOfDay - 6 * 86400000) return "7 天内";
  return "更早";
}

function durText(ms) {
  if (ms == null) return "";
  if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
  const m = Math.floor(ms / 60000);
  return `${m}m${Math.round((ms % 60000) / 1000)}s`;
}

// 工具名 → 中文名称与图标
const TOOL_META = {
  read_file: { label: "读取文件", icon: "fileText" },
  write_file: { label: "写入文件", icon: "filePlus" },
  list_files: { label: "列出文件", icon: "folder" },
  list_dir: { label: "列出目录", icon: "folder" },
  run_code: { label: "运行代码", icon: "terminal" },
  search: { label: "检索", icon: "search" },
};

function toolMeta(name) {
  const meta = TOOL_META[name];
  if (meta) return meta;
  return { label: name, icon: "terminal" };
}

const SUMMARY_KEYS = ["path", "file", "dir", "query", "q", "keyword", "url", "command", "code", "target", "name", "id"];

// 参数 → 一行目标摘要（取第一个可读的字符串参数）
function argSummary(args) {
  if (!args || typeof args !== "object") return "";
  for (const k of SUMMARY_KEYS) {
    if (typeof args[k] === "string" && args[k]) return args[k];
  }
  for (const v of Object.values(args)) {
    if (typeof v === "string" && v) return v.length > 60 ? v.slice(0, 60) + "…" : v;
  }
  return "";
}

function truncate(s, n) {
  s = String(s ?? "");
  return s.length > n ? s.slice(0, n) + "…" : s;
}

function greeting() {
  const h = new Date().getHours();
  if (h < 6) return "夜深了";
  if (h < 12) return "上午好";
  if (h < 18) return "下午好";
  return "晚上好";
}


// ===== js/markdown.js =====
// 安全 Markdown 渲染：先转义后转换（沿用 v1 已验证算法，补代码块语言栏/复制钮/表格包裹）
// 红线：所有模型输出必须先转义；链接仅 http(s) 且 rel=noopener

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function renderMarkdown(src) {
  let html = "";
  let inCode = false;
  let codeLang = "";
  let codeBuf = [];
  let inList = false;
  let listTag = "ul";
  let tableBuf = null;

  const flushList = () => {
    if (inList) {
      html += `</${listTag}>`;
      inList = false;
    }
  };
  const flushTable = () => {
    if (tableBuf && tableBuf.length) {
      let t = '<div class="md-table-wrap"><table>';
      tableBuf.forEach((row, i) => {
        const tag = i === 0 ? "th" : "td";
        t += "<tr>" + row.map((c) => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      html += t + "</table></div>";
      tableBuf = null;
    }
  };
  const flushCode = () => {
    const lang = codeLang ? `<span>${escapeHtml(codeLang)}</span>` : "<span>text</span>";
    html +=
      `<div class="codeblock"><div class="cb-bar">${lang}` +
      `<button class="cb-copy" data-copy type="button">${iconCopy()}复制</button></div>` +
      `<pre><code>${escapeHtml(codeBuf.join("\n"))}</code></pre></div>`;
    codeBuf = [];
    codeLang = "";
  };

  for (const line of String(src).split("\n")) {
    const fence = line.trim().match(/^```(\w*)/);
    if (fence) {
      if (inCode) {
        flushCode();
        inCode = false;
      } else {
        flushList();
        flushTable();
        inCode = true;
        codeLang = fence[1] || "";
      }
      continue;
    }
    if (inCode) {
      codeBuf.push(line);
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const cells = line.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      if (cells.length && cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;
      (tableBuf = tableBuf || []).push(cells);
      continue;
    }
    flushTable();
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      flushList();
      const n = h[1].length;
      html += `<h${n}>${inline(h[2])}</h${n}>`;
      continue;
    }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
      flushList();
      html += "<hr/>";
      continue;
    }
    if (/^\s*&gt;\s?/.test(line) || /^\s*>\s?/.test(line)) {
      flushList();
      html += `<blockquote>${inline(line.replace(/^\s*>\s?/, ""))}</blockquote>`;
      continue;
    }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.、]\s+(.*)$/);
    if (ul || ol) {
      const tag = ul ? "ul" : "ol";
      if (!inList || listTag !== tag) {
        flushList();
        html += `<${tag}>`;
        inList = true;
        listTag = tag;
      }
      html += `<li>${inline((ul || ol)[1])}</li>`;
      continue;
    }
    flushList();
    if (line.trim() === "") continue;
    html += `<p>${inline(line)}</p>`;
  }
  flushList();
  flushTable();
  if (inCode) flushCode();
  return html;
}

function iconCopy() {
  // 局部引入避免循环依赖：与 icons.js 的 copy 图标保持一致
  return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
}

// 事件委托：代码块复制按钮
function bindMarkdownActions(root) {
  root.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-copy]");
    if (!btn) return;
    const pre = btn.closest(".codeblock")?.querySelector("pre");
    if (pre && navigator.clipboard) navigator.clipboard.writeText(pre.textContent || "");
    const old = btn.innerHTML;
    btn.textContent = "已复制";
    setTimeout(() => (btn.innerHTML = old), 1200);
  });
}


// ===== js/ui.js =====
// 对话流组件构建（§4 核心组件）——纯建 DOM，不持有全局状态；指针与状态机在 app.js

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/* ---------- 用户消息 ---------- */
function addUserMsg(text) {
  const n = el("div", "msg-user");
  n.textContent = text;
  return n;
}

/* ---------- 思考块（§4.1）：流式自动展开 → 完成自动收拢为“已深度思考 Ns” ---------- */
function createThinking() {
  const startTs = Date.now();
  const node = el("div", "thinking open");
  const head = el("button", "thinking-head");
  head.innerHTML = `${icon("sparkles", 13)}<span class="t-label shimmer">正在深度思考…</span><span class="secs hidden"></span>${icon("chevDown", 13, "chev")}`;
  const body = el("div", "thinking-body");
  node.append(head, body);
  const setLabel = () => {
    const secs = node.querySelector(".secs");
    secs.textContent = ` ${durText(Date.now() - startTs)}`;
    secs.classList.remove("hidden");
  };
  const stream = (delta) => {
    body.textContent += delta;
    body.scrollTop = body.scrollHeight;
  };
  const finish = () => {
    node.classList.remove("open");
    node.querySelector(".t-label").classList.remove("shimmer");
    node.querySelector(".t-label").textContent = "已深度思考";
    setLabel();
  };
  head.addEventListener("click", () => node.classList.toggle("open"));
  return { node, stream, finish };
}

// 历史：无时长信息，静态收拢
function createThinkingStatic() {
  const node = el("div", "thinking");
  const head = el("button", "thinking-head");
  head.innerHTML = `${icon("sparkles", 13)}<span class="t-label">已深度思考</span>${icon("chevDown", 13, "chev")}`;
  const body = el("div", "thinking-body");
  node.append(head, body);
  head.addEventListener("click", () => node.classList.toggle("open"));
  return { node, body };
}

/* ---------- 活动组（§4.2）：流式自动展开 → 完成自动收拢为摘要行 ---------- */
function createGroup() {
  const startTs = Date.now();
  const node = el("div", "group open");
  const head = el("button", "group-head");
  const list = el("div", "group-list");
  node.append(head, list);

  const rows = [];
  let timer = null;
  const paint = () => {
    const running = rows.filter((r) => r.status === "running").length;
    const done = rows.length - running;
    if (running > 0) {
      head.innerHTML =
        `${icon("loader", 14, "spinner")}` +
        `<span class="g-label shimmer">${rows.length === 1 ? "正在" + rows[0].meta.label : `正在执行 · ${rows.length} 个工具`}</span>` +
        `<span class="g-secs">${durText(Date.now() - startTs)}</span>` +
        icon("chevDown", 14, "chev");
      if (!timer) timer = setInterval(paint, 100);
    } else {
      clearInterval(timer);
      timer = null;
      const total = durText(Date.now() - startTs);
      const iconOk = rows.every((r) => r.status === "done") ? "checkCircle" : "xCircle";
      head.innerHTML =
        `${icon(iconOk, 14)}` +
        `<span class="g-label">${rows.length === 1 ? rows[0].meta.label : `已执行 ${rows.length} 个工具`} · ${total}</span>` +
        icon("chevDown", 14, "chev");
    }
  };
  paint();

  head.addEventListener("click", () => node.classList.toggle("open"));

  const addTool = (name, args, l2) => {
    const meta = toolMeta(name);
    const row = el("div", "tool-row" + (l2 ? " l2" : ""));
    row.innerHTML =
      `<span class="t-icon">${icon(meta.icon, 14)}</span>` +
      `<span class="t-name">${meta.label}</span>` +
      `<span class="t-target" title=""></span>` +
      `<span class="t-status">${icon("loader", 13, "spinner")}</span>` +
      `<span class="t-dur"></span>`;
    const target = row.querySelector(".t-target");
    const summary = argSummary(args);
    target.textContent = summary;
    target.title = summary;
    list.appendChild(row);
    const r = { node: row, meta, name, status: "running", startTs: Date.now(), confirmCard: null };
    rows.push(r);
    paint();
    return r;
  };

  const endTool = (r, rejected) => {
    r.status = rejected ? "rejected" : "done";
    r.dur = Date.now() - r.startTs;
    r.node.classList.add(rejected ? "rejected" : "done");
    r.node.querySelector(".t-status").innerHTML = icon(rejected ? "x" : "check", 13);
    r.node.querySelector(".t-dur").textContent = rejected ? "" : durText(r.dur);
    paint();
  };

  const close = () => {
    // 兜底：契约下 tool_end 总会到达；若缺失（异常中断），收组时强制落状态避免永久转圈
    for (const r of rows) {
      if (r.status === "running") endTool(r, false);
    }
    clearInterval(timer);
    timer = null;
    node.classList.remove("open");
  };

  return { node, list, rows, addTool, endTool, close };
}

// 历史：静态收拢组（无耗时）
function createGroupStatic(items) {
  const node = el("div", "group");
  const head = el("button", "group-head");
  const list = el("div", "group-list");
  node.append(head, list);
  const allOk = true;
  head.innerHTML =
    `${icon(allOk ? "checkCircle" : "xCircle", 14)}` +
    `<span class="g-label">${items.length === 1 ? toolMeta(items[0].name).label : `已执行 ${items.length} 个工具`}</span>` +
    icon("chevDown", 14, "chev");
  for (const it of items) {
    const meta = toolMeta(it.name);
    const row = el("div", "tool-row done");
    const summary = argSummary(it.arguments);
    row.innerHTML =
      `<span class="t-icon">${icon(meta.icon, 14)}</span>` +
      `<span class="t-name">${meta.label}</span>` +
      `<span class="t-target">${escapeText(summary)}</span>` +
      `<span class="t-status">${icon("check", 13)}</span>`;
    list.appendChild(row);
  }
  head.addEventListener("click", () => node.classList.toggle("open"));
  return node;
}

/* ---------- L2 内联确认卡（§4.3） ---------- */
function createConfirm(ev, { onDecide }) {
  const args = ev.args || {};
  const card = el("div", "confirm-card pending");
  const rel = String(args.path ?? "-");
  const head = el("div", "confirm-head");
  head.innerHTML = `${icon("shield", 15)}<span>需要你的确认</span><span class="lv-badge">L2</span><span class="c-tool">${escapeText(ev.tool)}</span>`;
  card.appendChild(head);

  const secTarget = el("div", "confirm-sec");
  secTarget.innerHTML = `<div class="c-label">目标</div><div class="c-path">${escapeText(rel)}</div><div class="c-abs">${escapeText(args.absolute ?? "")}</div>`;
  card.appendChild(secTarget);

  if (args.content != null) {
    const secPrev = el("div", "confirm-sec");
    secPrev.innerHTML = `<div class="c-label">内容预览</div>`;
    const pre = el("div", "c-preview");
    pre.textContent = truncate(String(args.content), 2000);
    secPrev.appendChild(pre);
    card.appendChild(secPrev);
  }

  const actions = el("div", "confirm-actions");
  actions.innerHTML = `<span class="esc-hint">Esc 拒绝</span>`;
  const denyBtn = el("button", "btn btn-ghost", "拒绝");
  const okBtn = el("button", "btn btn-ink", "同意执行");
  actions.append(denyBtn, okBtn);
  card.appendChild(actions);

  const decide = (approved) => {
    if (!card.classList.contains("pending")) return;
    card.classList.remove("pending");
    actions.remove();
    const verdict = el("div", "confirm-verdict " + (approved ? "ok" : "deny"));
    verdict.innerHTML = approved ? `${icon("checkCircle", 13)} 已同意执行` : `${icon("xCircle", 13)} 已拒绝`;
    card.prepend(verdict);
    onDecide(approved);
  };
  denyBtn.addEventListener("click", () => decide(false));
  okBtn.addEventListener("click", () => decide(true));

  return { node: card, decide, isPending: () => card.classList.contains("pending") };
}

/* ---------- 系统提示 chip（§4.4） ---------- */
function createChip(text, iconName = "swap") {
  return el("div", "chip", `${icon(iconName, 12)}<span>${escapeText(text)}</span>`);
}

/* ---------- 上下文压缩卡（§4.5） ---------- */
function createCompaction(ev) {
  const node = el("div", "compaction");
  const head = el("button", "compaction-head");
  // live 事件带前后 tokens；历史消息仅有 tokensBefore（契约 §7）
  const tokens = ev.tokensAfter != null
    ? `（${fmtK(ev.tokensBefore)} → ${fmtK(ev.tokensAfter)} tokens）`
    : ev.tokensBefore != null
      ? `（压缩前约 ${fmtK(ev.tokensBefore)} tokens）`
      : "";
  head.innerHTML =
    `${icon("archive", 14)}<span>上下文已压缩：${ev.messagesBefore ?? "-"} → ${ev.messagesAfter ?? "-"} 条${tokens}</span>${icon("chevDown", 13, "chev")}`;
  const body = el("div", "compaction-body");
  body.textContent = ev.summary || "";
  node.append(head, body);
  head.addEventListener("click", () => node.classList.toggle("open"));

}

/* ---------- 错误卡（§4.6）：发生了什么 / 原因 / 下一步 ---------- */
function createError({ title, why, next }) {
  const node = el("div", "error-card");
  node.innerHTML =
    `<div class="e-title">${icon("alert", 14)}<span>${escapeText(title)}</span></div>` +
    (why ? `<div class="e-row"><b>原因</b>　${escapeText(why)}</div>` : "") +
    (next ? `<div class="e-row"><b>下一步</b>　${escapeText(next)}</div>` : "");
  return node;
}

/* ---------- 文件交付卡片（PRD 3.1 文件卡片；对齐 WorkBuddy/千问办公的交付导向） ---------- */
const FILE_EXTS = "md|txt|csv|json|log|html?|xlsx|xls|docx?|pptx?|pdf|png|jpe?g";

// 从正文中提取被写入文件的路径（仅认反引号包裹的相对路径，保守匹配）
function extractWrittenPath(text) {
  const m = String(text || "").match(new RegExp("`([^`\\n]+?\\.(" + FILE_EXTS + "))`", "i"));
  return m ? m[1] : null;
}

function createFileCard(path, onPreview) {
  const name = String(path).split(/[\\/]/).pop() || String(path);
  const extM = name.match(/\.([a-z0-9]+)$/i);
  const ext = extM ? extM[1].toUpperCase() : "FILE";
  const node = el("div", "file-card");
  node.innerHTML =
    `<span class="f-icon">${icon("fileText", 18)}</span>` +
    `<span class="f-main"><span class="f-row"><span class="f-name"></span><span class="f-badge">${escapeText(ext)}</span></span>` +
    `<span class="f-path">${escapeText(path)}</span></span>` +
    `<span class="f-actions"></span>`;
  node.querySelector(".f-name").textContent = name;
  const actions = node.querySelector(".f-actions");
  if (onPreview) {
    const pv = el("button", "f-copy", `${icon("eye", 12)}预览`);
    pv.addEventListener("click", () => onPreview(path));
    actions.appendChild(pv);
  }
  const btn = el("button", "f-copy", `${icon("copy", 12)}复制路径`);
  btn.addEventListener("click", () => {
    navigator.clipboard?.writeText(String(path));
    const old = btn.innerHTML;
    btn.textContent = "已复制";
    setTimeout(() => (btn.innerHTML = old), 1200);
  });
  actions.appendChild(btn);
  return node;
}

/* ---------- 计划 / Todo 卡（PRD 3.7 Plan-first；对齐 Kimi Todo / ZCode 计划展示） ----------
   契约扩展事件演示：{ type:"plan_update", steps:[{text,status:"pending"|"running"|"done"}] }
   契约未扩展前主进程不发送该事件，UI 自然不出现（向后兼容） */
function createPlan() {
  const startTs = Date.now();
  const node = el("div", "plan open");
  const head = el("button", "plan-head");
  const list = el("div", "plan-list");
  node.append(head, list);
  let steps = [];
  const ICONS = { pending: "circle", running: "loader", done: "checkCircle" };

  const paintHead = () => {
    const done = steps.filter((s) => s.status === "done").length;
    const running = steps.some((s) => s.status === "running");
    const total = durText(Date.now() - startTs);
    if (!running && done === steps.length && steps.length) {
      head.innerHTML = `${icon("listTodo", 14)}<span class="p-label">计划 · ${steps.length} 步全部完成 · ${total}</span>${icon("chevDown", 13, "chev")}`;
    } else {
      head.innerHTML =
        `${icon("listTodo", 14)}` +
        `<span class="p-label shimmer">计划 · ${done}/${steps.length}${running ? " · 执行中" : ""}</span>` +
        `<span class="p-secs">${total}</span>${icon("chevDown", 13, "chev")}`;
    }
  };
  const paintList = () => {
    list.innerHTML = "";
    for (const s of steps) {
      const row = el("div", "plan-step " + s.status);
      row.innerHTML =
        `<span class="ps-icon">${icon(s.status === "running" ? "loader" : ICONS[s.status] || "circle", 13, s.status === "running" ? "spinner" : "")}</span>` +
        `<span class="ps-text"></span>`;
      row.querySelector(".ps-text").textContent = s.text;
      list.appendChild(row);
    }
  };
  let timer = null;
  const ensureTimer = () => {
    if (!timer) timer = setInterval(() => paintHead(), 1000);
  };
  head.addEventListener("click", () => node.classList.toggle("open"));

  return {
    node,
    update(next) {
      steps = next.slice();
      paintList();
      paintHead();
      const allDone = steps.length && steps.every((s) => s.status === "done");
      node.classList.toggle("open", !allDone); // 流式自动展开，完成自动收拢
      if (allDone) {
        clearInterval(timer);
        timer = null;
      } else {
        ensureTimer();
      }
    },
  };
}

/* ---------- 右侧抽屉（产出预览 / 交付物看板 / 技能 / 自动化 共用壳） ---------- */
function createDrawer(title, { onClose } = {}) {
  const backdrop = el("div", "drawer-backdrop");
  const node = el("aside", "drawer");
  const head = el("div", "drawer-head");
  head.innerHTML = `<span class="d-title"></span>`;
  head.querySelector(".d-title").textContent = title;
  const closeBtn = el("button", "d-close");
  closeBtn.innerHTML = icon("close", 16);
  head.appendChild(closeBtn);
  const body = el("div", "drawer-body");
  node.append(head, body);
  const close = () => {
    backdrop.remove();
    node.remove();
    onClose?.();
  };
  closeBtn.addEventListener("click", close);
  backdrop.addEventListener("click", close);
  document.body.append(backdrop, node);
  return { node, body, close };
}

/* ---------- 打字动画 ---------- */
function createTyping() {
  const node = el("div", "md-text");
  node.innerHTML = `<span class="typing"><span></span><span></span><span></span></span>`;
  return node;
}

/* ---------- AI 正文块：流式追加 + 光标 ---------- */
function createTextBlock() {
  const node = el("div", "md-text");
  let raw = "";
  const cursor = el("span", "cursor");
  const paint = () => {
    node.innerHTML = renderMarkdown(raw);
    node.appendChild(cursor);
  };
  return {
    node,
    append(delta) {
      raw += delta;
      paint();
    },
    finalize() {
      node.innerHTML = renderMarkdown(raw);
    },
    get raw() {
      return raw;
    },
  };
}

/* ---------- 历史正文块 ---------- */
function createTextStatic(text) {
  const node = el("div", "md-text");
  node.innerHTML = renderMarkdown(text);
  return node;
}

function fmtK(n) {
  if (n == null) return "-";
  if (n >= 1000) return (n / 1000).toFixed(1) + "k";
  return String(n);
}

function escapeText(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}


// ===== js/app.js =====
// 应用装配：状态机 + UiEvent→组件映射（§6）+ composer/侧栏/菜单/键盘/滚动
// 通过 window.ordo 通信；未注入时由 demo/engine.js 提供 mock（原型模式）

const $ = (id) => document.getElementById(id);
const thread = $("thread");
const scroller = $("scroller");
const composerWrap = $("composer-wrap");
const composerStack = $("composer-stack"); // 常驻引用：脱离文档树后 getElementById 会找不到
const composer = $("composer");
const input = $("input");
const sendBtn = $("send-btn");
const statusBadge = $("status-badge");
const jumpBtn = $("jump-bottom");
const expertBtn = $("expert-btn");
const thinkingBtn = $("thinking-btn");
const sessionList = $("session-list");

const state = {
  status: "idle", // idle | streaming | awaiting_confirm
  runStart: 0,
  statusTimer: null,
  turn: null,          // 当前回合容器
  textBlock: null,     // 流式正文指针
  group: null,         // 打开中的活动组指针
  thinking: null,      // 思考块指针
  typing: null,
  pendingConfirm: null, // { id, card }
  pendingFile: null,    // 文件交付卡待渲染：{ path: string|null }（write_file 成功后置位）
  plan: null,           // 计划卡指针（plan_update 契约扩展事件；未扩展时恒为 null）
  drawer: null,         // 右侧抽屉（技能/自动化管理面共用）
  wb: { open: false, tab: "progress", manualClosed: false, preview: null, steps: [] }, // 工作台
  artifacts: new Map(), // 会话内交付物：path -> {name}
  wsLocked: false,      // 会话锚定工作区后为 true（首条消息发出时锁定）
  activeSessionId: null,
  experts: null,
  thinkingState: null,
};

/* ============ 滚动策略（§4.7） ============ */
let stick = true;
scroller.addEventListener("scroll", () => {
  const gap = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight;
  stick = gap < 48;
  jumpBtn.classList.toggle("hidden", stick);
  if (!jumpBtn.classList.contains("hidden")) {
    jumpBtn.style.bottom = composerWrap.offsetHeight + 16 + "px";
  }
});
function scrollBottom(force = false) {
  if (stick || force) {
    scroller.scrollTop = scroller.scrollHeight;
    jumpBtn.classList.add("hidden");
  }
}
jumpBtn.addEventListener("click", () => { stick = true; scrollBottom(true); });

/* ============ 顶栏状态（§3.3） ============ */
function setStatus(next) {
  state.status = next;
  clearInterval(state.statusTimer);
  state.statusTimer = null;
  statusBadge.classList.remove("running", "waiting");
  if (next === "streaming") {
    state.runStart = Date.now();
    statusBadge.classList.add("running");
    const paint = () => {
      const s = Math.round((Date.now() - state.runStart) / 1000);
      statusBadge.innerHTML = `<span class="dot"></span>执行中<span class="secs">${s}s</span>`;
    };
    paint();
    state.statusTimer = setInterval(paint, 1000);
  } else if (next === "awaiting_confirm") {
    statusBadge.classList.add("waiting");
    statusBadge.innerHTML = `<span class="dot"></span>等待确认`;
  } else {
    statusBadge.innerHTML = `<span class="dot"></span>就绪`;
  }
  composer.classList.toggle("disabled", next === "awaiting_confirm");
  input.disabled = next === "awaiting_confirm";
  updateSendBtn();
}

function updateSendBtn() {
  const busy = state.status === "streaming";
  sendBtn.disabled = state.status === "awaiting_confirm" || (!input.value.trim() && !busy);
  sendBtn.innerHTML = busy ? icon("square", 14) : icon("arrowUp", 15);
  sendBtn.title = busy ? "运行中（打断能力待主进程支持，按钮暂不可用）" : "发送（Enter）";
  if (busy) sendBtn.disabled = true; // 契约扩展（cancel）落地前停止不可用
}

/* ============ 回合与指针（§3.4） ============ */
function ensureTurn() {
  if (!state.turn || !state.turn.isConnected) {
    state.turn = el("div", "turn");
    thread.appendChild(state.turn);
  }
  return state.turn;
}
function append(node) {
  ensureTurn().appendChild(node);
  scrollBottom();
}

function removeTyping() {
  if (state.typing && state.typing.isConnected) state.typing.remove();
  state.typing = null;
}
function closeTextBlock() {
  if (state.textBlock) {
    state.textBlock.finalize();
    state.textBlock = null;
  }
}
function closeGroup() {
  if (state.group) {
    state.group.close();
    state.group = null;
  }
}
function closeThinking() {
  if (state.thinking) {
    state.thinking.finish();
    state.thinking = null;
  }
}

function hideEmpty() {
  if (emptyEl && emptyEl.isConnected) {
    emptyEl.remove();
    emptyEl = null;
    thread.classList.remove("is-empty");
    composerWrap.appendChild(composerStack); // 空态居中的输入区（含工作区选项行）落回底部
    input.focus();
    stick = true;
  }
}

/* ============ 事件映射（§6.2） ============ */
function handleEvent(ev) {
  switch (ev.type) {
    case "run_start":
      state.pendingFile = null;
      state.plan = null;
      setStatus("streaming");
      removeTyping();
      state.typing = createTyping();
      append(state.typing);
      refreshSessions(); // 侧栏当前会话卡片 → 运行中
      break;

    case "thinking_delta":
      removeTyping();
      if (!state.thinking) {
        state.thinking = createThinking();
        append(state.thinking.node);
      }
      state.thinking.stream(ev.text);
      scrollBottom();
      break;

    case "text_delta":
      removeTyping();
      closeThinking();
      closeGroup();
      if (!state.textBlock) {
        state.textBlock = createTextBlock();
        append(state.textBlock.node);
      }
      state.textBlock.append(ev.text);
      scrollBottom();
      break;

    case "plan_update":
      // 契约扩展事件：主进程未扩展时不发送，UI 自然不出现
      removeTyping();
      if (!state.plan || !state.plan.node.isConnected) {
        state.plan = createPlan();
        const anchor = state.turn?.querySelector(":scope > .md-text, :scope > .group, :scope > .typing");
        if (anchor) anchor.before(state.plan.node);
        else append(state.plan.node);
      }
      state.plan.update(ev.steps || []);
      // 工作台「进度」页签同步；任务带计划时自动展开（用户手动收起后不抢焦点）
      state.wb.steps = ev.steps || [];
      if (!state.wb.manualClosed) openWorkbench("progress");
      else renderWorkbench();
      scrollBottom();
      break;

    case "assistant_done":
      removeTyping();
      closeThinking();
      // 文件交付卡：write_file 成功后展示成果物（路径优先取确认参数，其次从正文反引号路径提取）
      if (state.pendingFile) {
        const p = state.pendingFile.path || (state.textBlock ? extractWrittenPath(state.textBlock.raw) : null);
        if (p) {
          const card = createFileCard(p, openArtifactPreview);
          registerArtifact(p);
          if (state.textBlock) state.textBlock.node.after(card);
          else ensureTurn().appendChild(card);
          scrollBottom();
        }
        state.pendingFile = null;
      }
      closeTextBlock();
      break;

    case "tool_start":
      removeTyping();
      closeThinking();
      closeTextBlock();
      if (!state.group || !state.group.node.isConnected || state.group.closed) {
        state.group = createGroup();
        append(state.group.node);
      }
      state.group.node.classList.add("open");
      state.lastToolRow = state.group.addTool(ev.name, ev.args || {}, ev.level === "L2");
      scrollBottom();
      break;

    case "tool_end": {
      const g = state.group;
      if (g) {
        const row = g.rows.filter((r) => r.status === "running").pop();
        if (row) g.endTool(row, row.rejected);
        // 写文件成功 → 待渲染交付卡（L2 路径来自确认参数；被拒绝则不渲染）
        if (row && row.name === "write_file" && !row.rejected && !state.pendingFile) {
          state.pendingFile = { path: row.confirmPath || null };
        }
        const anyRunning = g.rows.some((r) => r.status === "running");
        if (!anyRunning) closeGroup();
      }
      break;
    }

    case "notice":
      if (/失败|错误|error/i.test(ev.text || "")) {
        append(createError({ title: "执行出现问题", why: ev.text, next: "可重试发送，或换一种描述" }));
      } else {
        append(createChip(ev.text, "msg"));
      }
      break;

    case "confirm_request": {
      removeTyping();
      setStatus("awaiting_confirm");
      const anchorRow = state.lastToolRow;
      // 契约中 tool_start 无 args/level；L2 标识与目标摘要只能由 confirm_request.args 反推（P1 扩展前 live L1 行无摘要）
      if (anchorRow) {
        anchorRow.node.classList.add("l2");
        const target = anchorRow.node.querySelector(".t-target");
        if (!target.textContent && ev.args?.path) {
          target.textContent = ev.args.path;
          target.title = ev.args.path;
        }
      }
      const card = createConfirm(ev, {
        onDecide: (approved) => {
          state.pendingConfirm = null;
          if (anchorRow) {
            if (!approved) anchorRow.rejected = true;
            // 同意后记住目标路径，供 write_file 完成后的交付卡使用
            else if (approved && ev.args?.path) anchorRow.confirmPath = String(ev.args.path);
          }
          setStatus("streaming");
          api.respondConfirm(ev.id, approved).catch(() => {});
        },
      });
      state.pendingConfirm = { id: ev.id, card };
      if (state.group) {
        state.group.list.appendChild(card.node);
      } else {
        append(card.node);
      }
      stick = true;
      scrollBottom(true);
      break;
    }

    case "expert_switched":
      // 切换不进对话流，状态在 composer 按钮上呈现
      if (state.experts) {
        state.experts.currentId = ev.id;
        paintExpertBtn();
      }
      break;

    case "thinking_switched":
      if (state.thinkingState) {
        state.thinkingState.currentId = ev.id;
        paintThinkingBtn();
      }
      break;

    case "run_end":
      removeTyping();
      closeThinking();
      closeTextBlock();
      closeGroup();
      state.pendingFile = null;
      if (state.plan?.node?.isConnected) state.plan.node.classList.remove("open");
      state.plan = null;
      setStatus("idle");
      refreshSessions(); // 侧栏当前会话卡片 → 恢复最近更新时间
      break;

    case "session_saved":
      state.activeSessionId = ev.id;
      setSessionTitle(ev.title);
      refreshSessions();
      break;

    case "session_loaded":
      renderHistory(ev.messages || []);
      state.activeSessionId = ev.id;
      setSessionTitle(ev.title);
      lockWs(); // 历史会话已锚定
      refreshSessions();
      if (state.experts) {
        state.experts.currentId = ev.expert;
        paintExpertBtn();
      }
      break;

    case "context_compacted":
      append(createCompaction(ev));
      break;
  }
}

/* ============ 历史渲染（§6.2 底部规则） ============ */
function textOf(m) {
  const c = m && m.content;
  if (typeof c === "string") return c;
  return (c || []).filter((x) => x && x.type === "text").map((x) => x.text || "").join("");
}

function renderHistory(messages) {
  state.artifacts.clear();
  updateWbBadge();
  state.wb.steps = [];
  state.wb.preview = null;
  thread.querySelectorAll(".turn").forEach((n) => n.remove());
  state.turn = null;
  state.textBlock = null;
  state.group = null;
  state.thinking = null;
  hideEmpty();
  let groupBuf = [];
  const flushGroup = () => {
    if (groupBuf.length) {
      ensureTurn().appendChild(createGroupStatic(groupBuf));
      groupBuf = [];
    }
  };
  for (const m of messages || []) {
    if (m.role === "user") {
      flushGroup();
      ensureTurn().appendChild(addUserMsg(textOf(m)));
    } else if (m.role === "compactionSummary") {
      flushGroup();
      ensureTurn().appendChild(createCompaction({ messagesBefore: m.messagesBefore, messagesAfter: m.messagesAfter, tokensBefore: m.tokensBefore, summary: m.summary || m.text || "" }));
    } else if (m.role === "assistant") {
      const written = (m.content || [])
        .filter((c) => c && c.type === "toolCall" && c.name === "write_file" && c.arguments?.path)
        .map((c) => String(c.arguments.path));
      for (const c of m.content || []) {
        if (c.type === "thinking") {
          flushGroup();
          const t = createThinkingStatic();
          t.body.textContent = c.thinking || "";
          ensureTurn().appendChild(t.node);
        } else if (c.type === "toolCall") {
          groupBuf.push(c);
        } else if (c.type === "text" && c.text) {
          flushGroup();
          ensureTurn().appendChild(createTextStatic(c.text));
        }
      }
      flushGroup();
      // 交付卡：历史中写入文件的成果物（quiet：加载历史不自动弹工作台）
      for (const p of written) {
        registerArtifact(p, true);
        ensureTurn().appendChild(createFileCard(p, openArtifactPreview));
      }
    } else if (m.role === "toolResult") {
      // 结果摘要已并入工具行；不渲染
    }
  }
  flushGroup();
  if (state.wb.open) renderWorkbench();
  if (!thread.querySelector(".turn")) showEmpty();
  stick = true;
  scrollBottom(true);
}

function showEmpty() {
  ensureEmptyState();
}

/* ============ 空状态（§3.6） ============ */
let emptyEl = null;
function ensureEmptyState() {
  if (emptyEl && emptyEl.isConnected) return;
  emptyEl = el("div");
  emptyEl.id = "empty-state";
  emptyEl.innerHTML = `

/* ============ 发送（§6.1） ============ */
async function send(preset) {
  const text = (preset ?? input.value).trim();
  if (!text || state.status !== "idle") return;
  hideEmpty();
  input.value = "";
  autoResize();
  updateSendBtn();
  ensureTurn().appendChild(addUserMsg(text));
  lockWs(); // 首条消息发出即锚定工作区
  stick = true;
  scrollBottom(true);
  try {
    await api.prompt(text);
  } catch (e) {
    append(createError({
      title: "任务未能开始",
      why: (e && e.message) || String(e),
      next: "检查模型服务连接后重新发送",
    }));
    setStatus("idle");
  }
}

sendBtn.addEventListener("click", () => send());
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
input.addEventListener("input", () => {
  autoResize();
  updateSendBtn();
});
function autoResize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

/* ============ 工作台（进度 / 交付物 / 预览）—— 对话+工作台双栏，对齐豆包/千问/Kimi ============ */
const workbench = $("workbench");
const wbBody = $("wb-body");

function openWorkbench(tab) {
  if (tab) state.wb.tab = tab;
  state.wb.open = true;
  workbench.classList.add("open");
  renderWorkbench();
}
function closeWorkbench(manual = true) {
  state.wb.open = false;
  if (manual) state.wb.manualClosed = true;
  workbench.classList.remove("open");
}
function resetWorkbench() {
  state.wb.open = false;
  state.wb.manualClosed = false;
  state.wb.preview = null;
  state.wb.steps = [];
  workbench.classList.remove("open");
}
function setWbTab(tab) {
  state.wb.tab = tab;
  state.wb.preview = null;
  renderWorkbench();
}
document.querySelectorAll(".wb-tab").forEach((b) => b.addEventListener("click", () => setWbTab(b.dataset.tab)));
$("wb-collapse").addEventListener("click", () => closeWorkbench());
$("wb-toggle").addEventListener("click", () => (state.wb.open ? closeWorkbench() : openWorkbench()));

function renderWorkbench() {
  document.querySelectorAll(".wb-tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.wb.tab));
  if (state.wb.preview) return renderWbPreview(state.wb.preview);
  if (state.wb.tab === "progress") return renderWbProgress();
  return renderWbFiles();
}
function renderWbProgress() {
  wbBody.innerHTML = "";
  const steps = state.wb.steps || [];
  if (!steps.length) {
    wbBody.appendChild(el("div", "wb-empty", "任务开始后，这里实时显示执行计划与步骤进度"));
    return;
  }
  wbBody.appendChild(el("div", "wb-section-title", "执行计划"));
  for (const s of steps) {
    const row = el("div", "wb-step " + s.status);
    row.innerHTML =
      `<span class="ps-icon">${icon(s.status === "running" ? "loader" : s.status === "done" ? "checkCircle" : "circle", 14, s.status === "running" ? "spinner" : "")}</span>` +
      `<span class="ps-text"></span>`;
    row.querySelector(".ps-text").textContent = s.text;
    wbBody.appendChild(row);
  }
}
function renderWbFiles() {
  wbBody.innerHTML = "";
  if (!state.artifacts.size) {
    wbBody.appendChild(el("div", "wb-empty", "任务产出的文件会集中在这里，点击可预览"));
    return;
  }
  wbBody.appendChild(el("div", "wb-section-title", `交付物 · ${state.artifacts.size}`));
  for (const [path, it] of state.artifacts) {
    const item = el("button", "wb-file");
    item.innerHTML =
      `${icon("fileText", 16)}` +
      `<span class="f-main"><span class="f-name"></span><span class="f-path"></span></span>`;
    item.querySelector(".f-name").textContent = it.name;
    item.querySelector(".f-path").textContent = path;
    item.addEventListener("click", () => {
      state.wb.preview = path;
      renderWorkbench();
    });
    wbBody.appendChild(item);
  }
}
function renderWbPreview(path) {
  wbBody.innerHTML = "";
  const back = el("button", "wb-preview-back", `${icon("arrowLeft", 13)}交付物列表`);
  back.addEventListener("click", () => {
    state.wb.preview = null;
    renderWorkbench();
  });
  wbBody.appendChild(back);
  wbBody.appendChild(el("div", "wb-preview-path", String(path)));
  const holder = el("div", "md-text", "加载中…");
  wbBody.appendChild(holder);
  Promise.resolve(api.readFilePreview?.(path) ?? null)
    .then((md) => {
      holder.innerHTML = md
        ? renderMarkdown(md)
        : "该文件类型暂不支持预览（需主进程契约扩展 readFilePreview）";
    })
    .catch(() => {});
}
function updateWbBadge() {
  const badge = $("wb-badge");
  badge.classList.toggle("hidden", state.artifacts.size === 0);
  badge.textContent = String(state.artifacts.size);
}
function registerArtifact(path, quiet) {
  const name = String(path).split(/[\\/]/).pop();
  state.artifacts.set(String(path), { name });
  updateWbBadge();
  if (state.wb.open) {
    if (state.wb.tab === "files") renderWorkbench();
  } else if (!state.wb.manualClosed && !quiet) {
    openWorkbench("files"); // 首个交付物自动展开工作台（历史加载为 quiet，不打扰浏览）
  }
}
// 交付卡「预览」入口：总是打开工作台预览（显式操作不受手动收起限制）
function openArtifactPreview(path) {
  state.wb.preview = path;
  openWorkbench("files");
}

function closeDrawer() {
  if (state.drawer) {
    state.drawer.close();
    state.drawer = null;
    return true;
  }
  return false;
}

function mkCard(cfg) {
  // cfg: { module, id, icon, title, desc, mine, version, enabled, adminDisabled, perms, onDelete }
  const off = cfg.enabled === false;
  const item = el("div", "mk-card" + (off || cfg.adminDisabled ? " off" : ""));
  const tags = [];
  if (cfg.adminDisabled) tags.push(`<span class="tag-off">管理员已停用</span>`);
  tags.push(cfg.mine ? `<span class="tag-mine">个人</span>` : `<span class="tag-ent">企业</span>`);
  if (cfg.version) tags.push(`<span class="tag-ver">${cfg.version}</span>`);
  item.innerHTML =
    `<div class="mk-top">` +
    `<span class="mk-ic">${icon(cfg.icon, 16)}</span>` +
    `<span class="r-name"></span>` +
    `<span class="r-tags">${tags.join("")}</span>` +
    `</div>` +
    `<div class="mk-desc"></div>` +
    (cfg.perms ? `<div class="mk-perms"></div>` : "") +
    `<div class="mk-foot">` +
    `<span class="mk-state">${cfg.adminDisabled ? "管理员已停用" : off ? "已停用 · 本机不调用" : "已启用"}</span>` +
    `<span class="mk-foot-r">` +
    (cfg.mine ? `<span class="mk-ops"><button class="del" type="button" title="删除">${icon("trash", 13)}</button></span>` : "") +
    `<button class="switch${off ? "" : " on"}" type="button" ${cfg.adminDisabled ? "disabled" : ""}></button>` +
    `</span></div>`;
  item.querySelector(".r-name").textContent = cfg.title;
  item.querySelector(".mk-top").title = [cfg.desc, cfg.perms ? "所需权限：" + cfg.perms : ""].filter(Boolean).join("\n");
  item.querySelector(".mk-desc").textContent = cfg.desc || "";
  if (cfg.perms) item.querySelector(".mk-perms").textContent = "所需权限：" + cfg.perms;
  const sw = item.querySelector(".switch");
  sw.title = off ? "已停用（本机不调用，点击启用）" : "已启用（点击停用）";
  if (!cfg.adminDisabled) {
    sw.addEventListener("click", async () => {
      const next = !cfg.enabled;
      try {
        await api.setResourceEnabled?.(cfg.module, cfg.id, next);
      } catch {}
      toast(next ? `已启用「${cfg.title}」` : `已停用「${cfg.title}」，本机不再调用`);
      state.moduleRerender?.();
    });
  }
  if (cfg.mine) {
    item.querySelector(".mk-ops .del").addEventListener("click", () => {
      toast(`「${cfg.title}」为个人项；删除需契约扩展 deleteResource（P2）`);
    });
  }
  return item;
}

  if (!q) return true;

}

/* ============ composer 输入符号：@文件 / 命令 / $技能（ZCode 式） ============ */
let symbolMenuEl = null;
function closeSymbolMenu() {
  if (symbolMenuEl) {
    symbolMenuEl.remove();
    symbolMenuEl = null;
    return true;
  }
  return false;
}

function showSymbolMenu(symbol) {
  closeSymbolMenu();
  let items = null;
  if (symbol === "@") {
    const files = api.getWorkspaceFiles?.();
    if (!files || !files.length) return;
    items = files.map((f) => ({ label: "@" + f, desc: "工作区文件" }));
  } else if (symbol === "/") {
    items = [
      { label: "/周报", desc: "读取销售数据生成本周周报" },
      { label: "/核对", desc: "对数据文件做一致性核对" },
      { label: "/浏览", desc: "列出工作区结构并说明" },
    ];
  } else if (symbol === "$") {
    const skills = api.listSkills?.();
    if (!skills || !skills.length) return;
    items = skills.map((s) => ({ label: `${s.name}`, desc: `${s.desc || ""}（${s.scope || "企业"}技能）` }));
  }
  if (!items) return;
  const menu = el("div", "menu symbol-menu");
  for (const it of items) {
    const item = el("button", "menu-item");
    item.innerHTML = `<span class="mi-main"><span class="mi-name"></span><span class="mi-desc"></span></span>`;
    item.querySelector(".mi-name").textContent = it.label;
    item.querySelector(".mi-desc").textContent = it.desc || "";
    item.addEventListener("mousedown", (e) => {
      e.preventDefault(); // 保持输入框焦点
      input.value = input.value.replace(/[@/$]$/, it.label + " ");
      closeSymbolMenu();
      input.focus();
      autoResize();
      updateSendBtn();
    });
    menu.appendChild(item);
  }
  document.body.appendChild(menu);
  const r = composer.getBoundingClientRect();
  menu.style.left = r.left + 16 + "px";
  menu.style.top = r.top - menu.offsetHeight - 8 + "px";
  symbolMenuEl = menu;
}

input.addEventListener("input", () => {
  autoResize();
  updateSendBtn();
  const v = input.value;
  const last = v.slice(-1);
  const prev = v.slice(-2, -1);
  if ((last === "@" || last === "/" || last === "$") && (v.length === 1 || prev === " " || prev === "\n")) {
    showSymbolMenu(last);
  } else if (symbolMenuEl && last !== "@" && last !== "/" && last !== "$") {
    closeSymbolMenu();
  }
});

/* ============ 侧栏会话（§3.2）——WorkBuddy「空间」模式 ============
   对齐 WorkBuddy 任务列表（官方文档「任务管理」）：
   - 会话按工作空间归档分组（Ordo 会话创建即锚定工作区，PRD 3.8），分组标题吸顶、点击折叠；
   - 任务卡片三字段：标题 / 当前状态（运行中）/ 最近更新时间；
   - 任务级操作（悬停 ⋯）：置顶 / 重命名 / 打开工作区文件夹 / 删除；
   - 组级操作（悬停组头）：组内新建会话 / 打开工作空间文件夹。
   契约扩展（原型演示）：pinSession / renameSession / deleteSession（openWorkspaceDir 已有提案）。 */
let sessionQ = "";
const collapsedWs = new Set();

const sessionSearchInput = $("session-search");
sessionSearchInput.addEventListener("input", () => {
  sessionQ = sessionSearchInput.value;
  refreshSessions();
});
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
    const tag = document.activeElement?.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault();
    sessionSearchInput.focus();
    sessionSearchInput.select();
  }
});

async function refreshSessions() {
  let list = [];
  try {
    list = await api.listSessions();
  } catch {
    return;
  }
  sessionList.innerHTML = "";
  const q = sessionQ.trim().toLowerCase();
  const matched = q ? list.filter((s) => (s.title || "").toLowerCase().includes(q)) : list;
  if (!matched.length) {
    sessionList.appendChild(el("div", "session-empty", q ? "没有匹配的会话" : "暂无历史会话"));
    return;
  }
  let wsItems = [];
  try {
    wsItems = ((await Promise.resolve(api.listWorkspaces?.())) || {}).items || [];
  } catch {}
  const wsMap = new Map(wsItems.map((w) => [w.id, w]));
  const byWs = new Map();
  for (const s of matched) {
    const key = s.wsId && wsMap.has(s.wsId) ? s.wsId : wsItems[0]?.id || "default";
    if (!byWs.has(key)) byWs.set(key, []);
    byWs.get(key).push(s);
  }
  // 组间排序：项目工作区按最近活动在前，默认工作区（个人杂项）固定垫底
  const ts = (s) => +new Date(s.updatedAt || 0);
  const isDefaultWs = (id) => id === "default" || wsMap.get(id)?.tag === "默认";
  const ordered = [...byWs.entries()].sort((a, b) => {
    if (isDefaultWs(a[0]) !== isDefaultWs(b[0])) return isDefaultWs(a[0]) ? 1 : -1;
    return Math.max(...b[1].map(ts)) - Math.max(...a[1].map(ts));
  });
  for (const [wsId, items] of ordered) renderWsGroup(wsId, wsMap.get(wsId), items);
}

function renderWsGroup(wsId, ws, items) {
  // 组内：置顶优先，其余按最近更新倒序（WorkBuddy：置顶 = 置于列表顶端）
  items.sort((a, b) => +!!b.pinned - +!!a.pinned || +new Date(b.updatedAt || 0) - +new Date(a.updatedAt || 0));
  const wrap = el("div", "session-group" + (collapsedWs.has(wsId) ? " collapsed" : ""));
  const head = el("div", "ws-group-head");
  head.innerHTML = `<span class="chev">${icon("chevDown", 11)}</span><span class="g-name"></span><span class="g-cnt"></span>`;
  const name = ws?.label || (ws?.root || "").split("\\").pop() || "会话";
  head.querySelector(".g-name").textContent = name;
  head.querySelector(".g-name").title = ws?.root || name;
  head.querySelector(".g-cnt").textContent = items.length;
  head.addEventListener("click", () => {
    collapsedWs.has(wsId) ? collapsedWs.delete(wsId) : collapsedWs.add(wsId);
    refreshSessions();
  });
  const acts = el("span", "g-acts");
  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.title = "在此工作区新建会话";
  addBtn.innerHTML = icon("plus", 13);
  addBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    startNewSessionIn(ws);
  });
  const dirBtn = document.createElement("button");
  dirBtn.type = "button";
  dirBtn.title = "打开工作区文件夹";
  dirBtn.innerHTML = icon("folderOpen", 13);
  dirBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    await openWsDir(ws?.root);
  });
  acts.append(addBtn, dirBtn);
  head.appendChild(acts);
  wrap.appendChild(head);
  for (const s of items) wrap.appendChild(buildSessionItem(s, ws));
  sessionList.appendChild(wrap);
}

async function openWsDir(root) {
  try {
    await api.openWorkspaceDir?.(root);
    toast(`已在文件资源管理器打开：${root || ""}`);
  } catch {
    toast("打开目录失败（需主进程契约扩展 openWorkspaceDir）");
  }
}

async function startNewSessionIn(ws) {
  if (state.status !== "idle") return;
  if (ws?.id && ws.id !== wsState.currentId) {
    wsState.currentId = ws.id; // 预选工作区：新会话锚定到该工作区（PRD 3.8）
    api.switchWorkspace?.(ws.id, ws.root)?.catch?.(() => {});
    paintWsBtn();
    syncWsSurfaces();
  }
  try {
    await api.newSession();
  } catch {}
  resetToEmpty();
}

function buildSessionItem(s, ws) {
  const isActive = s.id === state.activeSessionId;
  const running = isActive && state.status !== "idle";
  const item = el("div", "session-item" + (isActive ? " active" : ""));
  const t = el("div", "t");
  if (s.pinned) {
    const flag = el("span", "pin-flag", icon("pin", 11));
    t.appendChild(flag);
  }
  const tText = document.createElement("span");
  tText.textContent = s.title || "新会话";
  t.appendChild(tText);
  t.title = s.title || "";
  const d = el("div", "d");
  if (running) {
    d.innerHTML = `<span class="run-dot"></span>运行中`; // WorkBuddy 卡片字段：当前状态
  } else {
    d.textContent = relTime(s.updatedAt); // 最近更新时间
  }
  const acts = el("div", "acts");
  const more = document.createElement("button");
  more.type = "button";
  more.title = "更多操作";
  more.innerHTML = icon("more", 15);
  more.addEventListener("click", (e) => {
    e.stopPropagation();
    openSessionMenu(more, s, item, ws);
  });
  acts.appendChild(more);
  item.append(t, d, acts);
  item.addEventListener("click", () => {
    if (!item.dataset.mode) openSession(s.id);
  });
  return item;
}

/* 会话条目菜单：向下弹出（区别于 composer 的向上菜单），危险项标红 */
let sessionMenuEl = null;
function closeSessionMenu() {
  sessionMenuEl?.remove();
  sessionMenuEl = null;
}
document.addEventListener("click", (e) => {
  if (sessionMenuEl && !sessionMenuEl.contains(e.target)) closeSessionMenu();
});

function openSessionMenu(anchor, s, item, ws) {
  closeSessionMenu();
  const menu = el("div", "menu");
  const mk = (label, ic, cls, fn) => {
    const b = el("button", "menu-item" + (cls ? " " + cls : ""));
    b.innerHTML =
      `<span class="mi-check">${icon(ic, 14)}</span>` +
      `<span class="mi-main"><span class="mi-name"></span></span>`;
    b.querySelector(".mi-name").textContent = label;
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      closeSessionMenu();
      fn();
    });
    return b;
  };
  menu.appendChild(
    mk(s.pinned ? "取消置顶" : "置顶", "pin", "", async () => {
      try {
        await api.pinSession?.(s.id, !s.pinned);
      } catch {}
      refreshSessions();
    })
  );
  menu.appendChild(mk("重命名", "pencil", "", () => startRename(item, s)));
  menu.appendChild(mk("打开工作区文件夹", "folderOpen", "", () => openWsDir(ws?.root)));
  menu.appendChild(mk("删除", "trash", "danger", () => startDelete(item, s)));
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  const left = Math.min(r.left, window.innerWidth - menu.offsetWidth - 12);
  let top = r.bottom + 6;
  if (top + menu.offsetHeight > window.innerHeight - 12) top = r.top - menu.offsetHeight - 6;
  menu.style.left = left + "px";
  menu.style.top = top + "px";
  sessionMenuEl = menu;
}

function startRename(item, s) {
  if (item.dataset.mode) return;
  item.dataset.mode = "rename";
  const t = item.querySelector(".t");
  const input = document.createElement("input");
  input.className = "rename";
  input.value = s.title || "";
  t.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const finish = async (commit) => {
    if (done) return;
    done = true;
    const title = input.value.trim();
    if (commit && title && title !== s.title) {
      try {
        await api.renameSession?.(s.id, title);
      } catch {}
      if (s.id === state.activeSessionId) setSessionTitle(title);
    }
    refreshSessions();
  };
  input.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter") finish(true);
    else if (e.key === "Escape") finish(false);
  });
  input.addEventListener("blur", () => finish(true));
  input.addEventListener("click", (e) => e.stopPropagation());
}

function startDelete(item, s) {
  if (item.dataset.mode) return;
  item.dataset.mode = "delete";
  const row = el("div", "del-row");
  const tip = document.createElement("span");
  tip.textContent = "删除后不可恢复";
  const ok = el("button", "mini danger");
  ok.type = "button";
  ok.textContent = "删除";
  const cancel = el("button", "mini");
  cancel.type = "button";
  cancel.textContent = "取消";
  row.append(tip, ok, cancel);
  item.querySelectorAll(".t, .d, .acts").forEach((n) => n.remove());
  item.appendChild(row);
  ok.addEventListener("click", async (e) => {
    e.stopPropagation();
    try {
      await api.deleteSession?.(s.id);
    } catch {}
    if (s.id === state.activeSessionId) {
      state.activeSessionId = null;
      try {
        await api.newSession?.();
      } catch {}
      resetToEmpty();
    }
    refreshSessions();
  });
  cancel.addEventListener("click", (e) => {
    e.stopPropagation();
    item.dataset.mode = "";
    refreshSessions();
  });
}

async function openSession(id) {
  if (state.status !== "idle") return;
  closeModuleView(); // 点会话回到对话视图
  try {
    const s2 = await api.loadSession(id);
    state.activeSessionId = id;
    setSessionTitle(s2.title);
    renderHistory(s2.messages || []);
    refreshSessions();
  } catch (err) {
    append(createError({ title: "会话加载失败", why: String((err && err.message) || err), next: "重试点击该会话" }));
  }
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms / speed));
function emit(ev) {
  for (const l of listeners) l(ev);
}

async function streamText(text, chunk = 5) {
  for (let i = 0; i < text.length; i += chunk) {
    emit({ type: "text_delta", text: text.slice(i, i + chunk) });
    await sleep(24);
  }
}
async function think(paras) {
  for (const p of paras) {
    emit({ type: "thinking_delta", text: p });
    await sleep(160);
  }
}

      if (s) s.pinned = pinned;
      return true;
    },
    renameSession: async (id, title) => {
      const s = sessions.find((x) => x.id === id);
      if (s) {

        s.updatedAt = now;
      }
      return true;
    },
    deleteSession: async (id) => {
      const i = sessions.findIndex((x) => x.id === id);
      if (i >= 0) sessions.splice(i, 1);

    },

    __getSpeed: () => speed,
    __failNextPrompt: () => (failNext = true),
  };
}

// 原型演示控制台（仅原型存在，正式版无此面板）：一键回放设计文档 §9 全部状态
function initDrawer(mock) {
  if (document.getElementById("demo-drawer")) return;
  const demo = () => window.__sdDemo || {};

  const wrap = document.createElement("div");
  wrap.id = "demo-drawer";
  wrap.innerHTML = `
    <button class="dd-fab" type="button">演示控制台</button>
    <div class="dd-panel hidden">
      <div class="dd-head">原型演示控制台<span class="dd-sub">正式版无此面板</span></div>
      <div class="dd-actions">
        <button data-act="weekly">▶ 完整任务流（思考→读取→L2 确认→写入）</button>
        <button data-act="check">▶ 数据核对（表格输出）</button>
        <button data-act="qa">▶ 知识问答（Markdown/代码块）</button>
        <button data-act="fail">▶ 工具失败与恢复</button>
        <button data-act="compact">▶ 上下文压缩卡片</button>
        <button data-act="confirm-deny">▶ L2 确认（自动拒绝演示）</button>
        <button data-act="history">📂 加载历史会话</button>
        <button data-act="error">✖ 模拟启动失败</button>
        <button data-act="switch">⇄ 切换专家（chip 演示）</button>
        <button data-act="reset">↺ 重置（空状态）</button>
      </div>
      <div class="dd-foot">
        <button data-act="speed" class="dd-speed">速度 ×1</button>
        <span>确认卡出现时按 <b>Esc</b> = 拒绝</span>
      </div>
    </div>`;
  document.body.appendChild(wrap);

  const fab = wrap.querySelector(".dd-fab");
  const panel = wrap.querySelector(".dd-panel");
  fab.addEventListener("click", () => panel.classList.toggle("hidden"));

  let denyNext = false;
  wrap.querySelector(".dd-actions").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === "reset") return demo().reset?.();
    if (act === "history") return demo().openSession?.("s1");
    if (act === "speed") {
      const fast = mock.__getSpeed() < 2.4;
      mock.__setSpeed(fast ? 3.2 : 1.6);
      btn.textContent = fast ? "速度 ×2" : "速度 ×1";
      return;
    }
    if (act === "error") {
      mock.__failNextPrompt();
      return demo().send?.("生成竞品分析报告");
    }
    if (act === "confirm-deny") {
      denyNext = true;
      demo().send?.("请读取 data/sales.txt，生成本周销售周报，并写入 out/weekly-report.md");
      // 确认卡出现后自动点「拒绝」，演示拒绝链路
      const t = setInterval(() => {
        const btnDeny = document.querySelector(".confirm-card.pending .btn-ghost");
        if (btnDeny) {
          clearInterval(t);
          setTimeout(() => btnDeny.click(), 1200 / (mock.__getSpeed() || 1.6));
        }
      }, 150);
      return;
    }
    if (act === "switch") {
      const target = mock.__currentExpert === "readonly" ? "general" : "readonly";
      mock.__currentExpert = target;
      return mock.switchExpert(target);
    }
    const prompts = {
      weekly: "请读取 data/sales.txt，生成本周销售周报，并写入 out/weekly-report.md",
      check: "读取 data/sales.txt，对数字做一致性核对，输出核对表",
      qa: "公司的报销流程是什么？",
      fail: "读取 data/sales-2025-07.txt，和本月做对比",
      compact: "继续 Q2 汇总长任务",
    };
    demo().send?.(prompts[act]);
  });
}
